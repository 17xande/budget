{{/*
  A spent-against-target bar: server-rendered SVG whose widths are attributes,
  not styles, so the strict CSP holds. Colours come from styles.css. Called with
  a budget.Line. Decorative: the numbers beside it carry the meaning.
*/}}
{{define "bar"}}{{if .Target.Valid}}<svg class="bar" role="presentation" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true" focusable="false"><rect class="track" width="100" height="6" rx="3"/><rect class="fill {{lineState .}}" width="{{barWidth .SpentCents .Target.Int64}}" height="6" rx="3"/></svg>{{end}}{{end}}
