{{define "document_head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — Budget</title>
{{/*
  Two htmx settings, both load-bearing.

  includeIndicatorStyles:false -- htmx would otherwise inject its .htmx-indicator
  rules as a <style> block, which style-src 'self' blocks silently and *open*: the
  rule that hides an indicator never applies. The rules live in styles.css instead.

  responseHandling -- htmx does not swap 4xx/5xx by default, which would swallow a
  server's refusal and leave the page looking as though nothing happened.
*/}}
<meta name="htmx-config" content='{"includeIndicatorStyles":false,
  "responseHandling":[{"code":"204","swap":false},
                      {"code":"[23]..","swap":true},
                      {"code":"[45]..","swap":true,"error":true}]}'>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
{{/*
  IBM Plex from Google Fonts, kept off our server by choice. The CSP names exactly
  these two hosts (style-src and font-src). styles.css keeps system fallbacks, so a
  blocked or slow font host costs the typeface and nothing else.
*/}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{asset "styles.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "dist/app.js"}}" type="module"></script>
</head>
{{end}}
